name: Daily hotel report

on:
  schedule:
    - cron: "0 13 * * *"   # 13:00 UTC = 8:00 AM Eastern (9:00 AM during daylight time)
  workflow_dispatch:        # lets you run it manually from the Actions tab

permissions:
  contents: write

concurrency:
  group: hotel-report
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Build report
        env:
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
        run: python fetch_hotels.py

      - name: Publish to job summary
        run: cat reports/latest.md >> "$GITHUB_STEP_SUMMARY"

      - name: Send to Discord
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python send_discord.py

      - name: Commit snapshot, state and report
        run: |
          git config user.name "hotel-report-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data reports
          git diff --staged --quiet || git commit -m "Hotel report $(date -u +%F)"
          git push
